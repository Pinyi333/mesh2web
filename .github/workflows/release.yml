name: Release to npm

# Publishes every @mesh2web/* workspace when a GitHub Release is published.
# Authenticates with npm Trusted Publishing (OIDC): no token or secret needed.
# Each @mesh2web/* package trusts Pinyi333/mesh2web + this workflow file.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # npm Trusted Publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm CLI >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Scoped packages are private by default; --access public (also set in
      # each package's publishConfig) is required on the free npm plan.
      - run: npm publish --workspaces --access public --provenance
